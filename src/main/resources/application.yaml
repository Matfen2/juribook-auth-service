spring:
  application:
    name: auth-service

  # ═══════════════════════════════════════════════════════════
  #  Connexion PostgreSQL (database per service)
  #  En conteneur Docker, surchargé par SPRING_DATASOURCE_URL
  # ═══════════════════════════════════════════════════════════
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: juribook
    password: juribook
    driver-class-name: org.postgresql.Driver

  # ═══════════════════════════════════════════════════════════
  #  JPA / Hibernate
  #  ddl-auto: validate → Hibernate vérifie le schéma,
  #  c'est Flyway qui gère les migrations
  # ═══════════════════════════════════════════════════════════
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  # ═══════════════════════════════════════════════════════════
  #  Flyway
  # ═══════════════════════════════════════════════════════════
  flyway:
    enabled: true

  # ═══════════════════════════════════════════════════════════
  #  Kafka — désactivé en dev local (pas de broker disponible)
  #  En production Docker, réactiver en supprimant l'exclude
  #  et en passant SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
  # ═══════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

server:
  port: 8081

# ═══════════════════════════════════════════════════════════
#  JWT
#  Secret min 256 bits pour HS256.
#  En production, surcharger via JWT_SECRET (variable d'env)
# ═══════════════════════════════════════════════════════════
jwt:
  secret: juribook-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000 # 24h en ms

# ═══════════════════════════════════════════════════════════
#  Springdoc / Swagger UI
# ═══════════════════════════════════════════════════════════
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false