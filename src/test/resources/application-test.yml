# ═══════════════════════════════════════════════════════════
#  application-test.yml - profil actif uniquement en test
#
#  Remplace PostgreSQL par H2 en mémoire et désactive Flyway
#  pour les tests @SpringBootTest (AuthServiceApplicationTests).
#  Les tests unitaires (@ExtendWith(MockitoExtension.class))
#  n'ont pas besoin de ce fichier - ils n'ouvrent pas de contexte.
# ═══════════════════════════════════════════════════════════

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop     # H2 crée et supprime le schéma automatiquement
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false              # Flyway désactivé - H2 est géré par Hibernate ddl-auto

  kafka:
    bootstrap-servers: localhost:9092
    # Kafka est ignoré en test (pas de vrai broker)
    # Les beans Kafka sont mockés dans les tests qui en ont besoin

jwt:
  secret: juribook-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000