# ═══════════════════════════════════════════════════════════
#  GitHub Actions CI/CD - auth-service
#  Pipeline : build → test → docker build & push (GHCR)
#  Déclenché sur push develop et pull request vers main
# ═══════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:

  # ─────────────────────────────────────────────
  #  Build + Tests Maven
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean compile -B

      - name: Test
        run: mvn test -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # ─────────────────────────────────────────────
  #  Docker Build & Push vers GHCR
  #  (sur push develop uniquement)
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auth-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/auth-service:latest
